<style>
:root{--bg:#080b12;--panel:#101722;--panel2:#151e2c;--text:#f4f7fb;--muted:#91a0b5;--line:#243044;--accent:#79dfb1;--accent2:#7ea7ff;--warn:#f2c66d;--danger:#ff858d;--good:#78dfa0;--r:17px;--shadow:0 12px 34px rgba(0,0,0,.26)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#080b12,#0c1220 60%,#080b12);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:16px 14px 92px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.brand h1{margin:0;font-size:22px;letter-spacing:-.02em}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#111a28;border-radius:999px;padding:6px 9px;font-size:11px;color:#d8e0ec}.system{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow:auto;padding:9px 0 13px;background:linear-gradient(180deg,rgba(8,11,18,.98),rgba(8,11,18,.88),transparent)}nav button{white-space:nowrap;border:1px solid var(--line);background:#101827;color:#cbd4e2;padding:8px 11px;border-radius:11px}nav button.active{background:var(--accent);border-color:transparent;color:#07130f;font-weight:800}.tab{display:none}.tab.active{display:block}.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:13px}.card{background:linear-gradient(180deg,var(--panel),#0e1520);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}.card h2{margin:0 0 10px;font-size:17px}.card h3{margin:0 0 8px;font-size:14px}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:31px;font-weight:850;letter-spacing:-.04em}.stat{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.bar{height:8px;background:#243047;border-radius:20px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:inherit}.notice{border:1px solid #334660;background:#152135;border-radius:12px;padding:10px 11px;margin:9px 0;color:#dae6f6}.notice.green{background:#12281f;border-color:#2d644a}.notice.yellow{background:#2b2416;border-color:#65532d}.notice.red{background:#30191f;border-color:#6f313c}.good{color:var(--good)}.warn{color:var(--warn)}.danger{color:var(--danger)}label{display:block;color:#c7d1df;font-size:12px;margin:0 0 5px}.field{margin:0 0 11px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0a101a;color:white;border-radius:10px;padding:9px 10px;outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.btn{border:0;border-radius:11px;padding:9px 12px;background:var(--accent);color:#07130f;font-weight:800}.btn.secondary{background:#1a2538;color:#e4ebf6;border:1px solid var(--line)}.btn.dangerbtn{background:#381820;color:#ffdce0;border:1px solid #64313b}.btn.sm{padding:5px 8px;font-size:12px}.timeline{position:relative;margin-left:9px}.timeline:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:#324057}.timeItem{display:grid;grid-template-columns:17px 92px 1fr;gap:9px;padding:8px 0;position:relative}.dot{width:11px;height:11px;margin-top:4px;border-radius:50%;background:var(--accent2);border:2px solid #0f1725;z-index:1}.when{font-size:12px;color:#93a2b6}.taskline{display:flex;align-items:flex-start;gap:8px;margin:6px 0}.taskline input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:1px}.metric{padding:12px;border:1px solid var(--line);background:#0f1826;border-radius:13px}.metric .delta{font-size:12px;font-weight:800}.quest{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);align-items:center}.quest:last-child{border-bottom:0}.quest input{width:19px;height:19px;accent-color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}th{font-size:11px;color:#98a5b8}.scroll{overflow:auto}.phase{padding:11px;border-left:4px solid var(--accent2);border-radius:10px;background:#121b29;margin-bottom:8px}.phase.current{background:#13261e;border-left-color:var(--accent)}.badge{display:inline-block;padding:3px 6px;background:#1b2840;border-radius:999px;font-size:10px;color:#dce7f7}.ring{--p:70;width:82px;height:82px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#263147 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#101722}.ring strong{z-index:1;font-size:23px}.footer{margin:22px 0;text-align:center;color:#718198;font-size:11px}.canvasWrap{height:190px;position:relative}.canvasWrap canvas{width:100%;height:100%}.split{display:flex;justify-content:space-between;gap:10px}.libraryItem{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.libraryItem:last-child{border-bottom:0}.update{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99;width:min(620px,calc(100% - 24px));padding:12px;border-radius:13px;background:#e8f7f0;color:#0d2119;box-shadow:0 18px 55px rgba(0,0,0,.45);display:none;align-items:center;gap:10px}.update.show{display:flex}.update .btn{margin-left:auto}@media(max-width:840px){.g4,.g3,.g2,.two{grid-template-columns:1fr}.app{padding:11px 11px 88px}.timeItem{grid-template-columns:17px 72px 1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>Trackline</h1><p>Middle-distance training, recovery and performance</p></div><span id="phasePill" class="pill">Loading…</span></header>
<div id="system" class="system"></div>
<nav id="nav"></nav>
<section id="todayTab" class="tab active"></section>
<section id="logTab" class="tab"></section>
<section id="trendsTab" class="tab"></section>
<section id="perfTab" class="tab"></section>
<section id="planTab" class="tab"></section>
<section id="libraryTab" class="tab"></section>
<section id="settingsTab" class="tab"></section>
<p class="footer">Trackline supports your coach's programme. Pain, injury and medical decisions belong with your coach, physio or clinician.</p>
</div>
<div id="updateBanner" class="update"><strong>Update available</strong><span class="small">Load the latest Trackline files. Your saved data stays in the database.</span><button id="applyUpdate" class="btn">Update</button></div>
<script>
const VERSION='3.0.0';
const NAV=[['todayTab','Today'],['logTab','Log'],['trendsTab','Trends'],['perfTab','Performance'],['planTab','Plan'],['libraryTab','Library'],['settingsTab','Settings']];
const PROFILE_DEFAULT={goalText:'Breakthrough 1500m season',goal1500:'',weeklyKm:'',sleepTarget:8.75,plantBased:true,xtDays:'Mon,Wed',raceDate:''};
const PHASES=[
{name:'Transition',start:'2026-08-20',end:'2026-08-31',priority:'Recover from the season, settle symptoms, restore freshness',xt:'Easy only; use bike/elliptical if it helps recovery rather than adding fatigue.'},
{name:'Durability base',start:'2026-09-01',end:'2026-10-31',priority:'Healthy running frequency, aerobic volume, threshold foundations, strength and tendon capacity',xt:'Optional 1–2 easy doubles/week, preferably Mon/Wed. 20–40 min bike/elliptical, RPE 2–3.'},
{name:'Aerobic strength',start:'2026-11-01',end:'2026-12-31',priority:'Threshold, hills, aerobic consistency, strength and durability',xt:'1–2 easy aerobic doubles/week if readiness is good. Avoid turning them into extra sessions.'},
{name:'Aerobic power + speed reserve',start:'2027-01-01',end:'2027-02-28',priority:'3k/5k strength, controlled speed, mechanics and maintained threshold',xt:'Usually 0–2 easy doubles/week. Reduce if they blunt Tue/Thu/Sat quality.'},
{name:'1500 conversion',start:'2027-03-01',end:'2027-04-30',priority:'Race pace, speed endurance, fatigue resistance and finishing mechanics',xt:'Use mostly for low-impact recovery. Specific running becomes more important.'},
{name:'Track season',start:'2027-05-01',end:'2027-08-31',priority:'Race, recover and adapt while maintaining engine, speed and durability',xt:'Optional recovery only around important races; freshness wins.'}
];
const WEEK={
0:{name:'Long run',focus:'Aerobic durability',run:'Coach-prescribed long aerobic run',double:'No planned double. Optional 15–25 min recovery spin only if specifically useful.'},
1:{name:'Easy + strength',focus:'Durability',run:'Easy run + scheduled strength',double:'Best double slot: 20–40 min very easy bike/elliptical, separated by 6+ hours, only if fresh.'},
2:{name:'Primary session',focus:'Quality',run:'Coach-prescribed primary session',double:'No extra aerobic workout. A short 10–15 min recovery spin is recovery, not training.'},
3:{name:'Absorb',focus:'Recovery',run:'Genuinely easy recovery running',double:'Second-best double slot: 20–40 min easy bike/elliptical if pain-free and well recovered.'},
4:{name:'Secondary session',focus:'Quality',run:'Coach-prescribed secondary session',double:'Avoid an added endurance session unless your coach planned it.'},
5:{name:'Rest',focus:'Regeneration',run:'Full rest from running unless coach changes plan',double:'No double. Rest means rest; mobility/rehab can still be appropriate.'},
6:{name:'Third key day',focus:'Quality / hills / race',run:'Coach-prescribed session, hills or race',double:'Do not add aerobic load simply to increase volume.'}
};
const PURPOSES=['Easy','Recovery','Long run','Threshold','Steady','Aerobic power','1500 pace','800 pace','Speed','Hills','Race','Strength','Plyometric','Rehab'];
const TYPES=['Run','Bike','Elliptical','Strength','Plyometric','Mobility','Race','Rest'];
const METRICS=[['1500 time','s','lower'],['800 time','s','lower'],['3000 time','s','lower'],['5k time','s','lower'],['Flying 30m','s','lower'],['Max speed','km/h','higher'],['VO2max','ml/kg/min','higher'],['Threshold pace','s/km','lower'],['Broad jump','cm','higher'],['CMJ','cm','higher'],['Straight-knee calf reps','reps','higher'],['Bent-knee calf reps','reps','higher'],['Body mass','kg','neutral']];
let db,installPrompt=null,waitingWorker=null;
const localDate=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return localDate(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const minsPerKm=w=>w.distance&&w.duration?w.duration/w.distance:null;
const paceText=m=>m?`${Math.floor(m)}:${String(Math.round((m%1)*60)).padStart(2,'0')}/km`:'—';
const secTime=s=>{if(s==null||s==='')return '—';s=+s;const m=Math.floor(s/60);return `${m}:${(s-m*60).toFixed(2).padStart(5,'0')}`};
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('runnerRPG',4);r.onupgradeneeded=e=>{const d=e.target.result;['daily','workouts','benchmarks','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function storeReq(store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode),os=tx.objectStore(store),r=fn(os);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const get=(s,id)=>storeReq(s,'readonly',o=>o.get(id));const all=s=>storeReq(s,'readonly',o=>o.getAll());const put=(s,v)=>storeReq(s,'readwrite',o=>o.put(v));const del=(s,id)=>storeReq(s,'readwrite',o=>o.delete(id));
async function setting(id,fallback){const x=await get('settings',id);return x?.value??fallback}async function setSetting(id,value){return put('settings',{id,value})}
async function defaults(){if(!await get('settings','profile'))await setSetting('profile',PROFILE_DEFAULT);if(!await get('settings','phases'))await setSetting('phases',PHASES);if(!await get('settings','meta'))await setSetting('meta',{})}
function phaseFor(date=localDate()){return PHASES.find(p=>date>=p.start&&date<=p.end)||PHASES[PHASES.length-1]}
function phaseProgress(p){const a=new Date(p.start+'T12:00:00'),b=new Date(p.end+'T12:00:00'),n=new Date(localDate()+'T12:00:00');return clamp((n-a)/(b-a)*100,0,100)}
function navInit(){const n=document.querySelector('#nav');n.innerHTML=NAV.map((x,i)=>`<button data-tab="${x[0]}" class="${i?'':'active'}">${x[1]}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>openTab(b.dataset.tab))}
async function openTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelector('#'+id).classList.add('active');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));await ({todayTab:renderToday,logTab:renderLog,trendsTab:renderTrends,perfTab:renderPerformance,planTab:renderPlan,libraryTab:renderLibrary,settingsTab:renderSettings}[id]||(()=>{}))()}
function num(label,name,value='',min='',max='',step='any'){return `<div class="field"><label>${label}</label><input type="number" name="${name}" value="${value??''}" min="${min}" max="${max}" step="${step}"></div>`}
function readiness(d,p){if(!d)return 70;let s=100;if(d.sleep!=null)s-=clamp((p.sleepTarget-d.sleep)*9,0,35);if(d.energy!=null)s-=(5-d.energy)*5;if(d.soreness!=null)s-=(d.soreness-1)*4;if(d.stress!=null)s-=(d.stress-1)*3;if(d.pain!=null)s-=d.pain*8;if(d.motivation!=null)s-=(5-d.motivation)*2;return Math.round(clamp(s,20,100))}
function dayTasks(day,phase){const quality=[2,4,6].includes(day);const easy=[0,1,3].includes(day);const commonMorning=['Morning check-in: sleep, energy, soreness, stress and pain','Eat breakfast; include carbohydrate and a meaningful protein source','5–8 min mobility/balance micro-dose'];let timeline=[{when:'Morning',items:commonMorning}];if(day===5){timeline.push({when:'Day',items:['Keep the day genuinely restorative','Complete prescribed rehab only','Regular meals and hydration even though training load is lower','Prepare Saturday kit and food']},{when:'Evening',items:['10 min easy mobility if it helps you feel better','Set up an 8.5–9+ hour sleep opportunity']});return timeline}
if(quality){timeline.push({when:'2–4 h pre',items:['Carbohydrate-rich meal + 20–30 g protein','500–750 ml fluid across the pre-session period; more if hot']},{when:'45–90 min',items:['Top-up carbohydrate if needed (banana, toast, cereal bar, sports drink)','Arrive with kit, spikes/shoes and session plan ready']},{when:'Warm-up',items:['10–15 min easy running unless coach specifies otherwise','Dynamic mobility + drills','4–6 progressive strides; finish feeling ready, not fatigued']},{when:'During',items:['Execute the coach session; do not add reps to chase a score','Record key splits/recoveries mentally or on watch','If pain meaningfully changes mechanics, stop and reassess']},{when:'0–60 min after',items:['Carbohydrate + 20–30 g protein','Fluids + salt according to sweat/conditions','5–10 min easy cool-down if prescribed']});}
else if(easy){timeline.push({when:'Pre-run',items:['Small carbohydrate snack if needed based on timing of meals','2–4 min ankle/hip movement before starting']},{when:'Run',items:['Keep the prescribed easy/long-run effort controlled','Finish with better mechanics than you started; no pace chasing']},{when:'After',items:['Normal meal/snack with carbohydrate + protein','Log duration, RPE and pain response']});}
timeline.push({when:'Evening',items:['Complete scheduled calf/soleus/foot work or strength — not extra random work','Prepare tomorrow’s food/kit','Aim for your full sleep target']});return timeline}
function microRoutine(){return ['Ankle rocks: 8–10/side, controlled','Single-leg balance: 2×30–45 s/side','Bent-knee calf isometric or calf raises: prescribed dose only','Hip flexor + glute mobility: 30–45 s/side','Foot control/toe yoga: 45–60 s','Optional 1 set of controlled bodyweight split squats if part of your physio plan']}
async function todayData(){return (await get('daily',localDate()))||{id:localDate(),tasks:{}}}
async function renderToday(){const [d,p,ws]=await Promise.all([todayData(),setting('profile',PROFILE_DEFAULT),all('workouts')]);const dow=new Date().getDay(),day=WEEK[dow],phase=phaseFor(),r=readiness(d,p),todayWs=ws.filter(w=>w.date===localDate()),tasks=dayTasks(dow,phase),risk=smartFlags(await all('daily'),ws,p);document.querySelector('#phasePill').textContent=phase.name;let idx=0;const timeline=tasks.map(g=>`<div class="timeItem"><i class="dot"></i><div class="when">${g.when}</div><div><strong>${g.when==='Morning'?'Start well':''}</strong>${g.items.map(t=>{const key='t'+(idx++);return `<label class="taskline"><input type="checkbox" data-task="${key}" ${d.tasks?.[key]?'checked':''}><span>${t}</span></label>`}).join('')}</div></div>`).join('');document.querySelector('#todayTab').innerHTML=`
<div class="g3 grid"><div class="card"><div class="stat"><div><span class="muted small">TODAY</span><h2 style="margin:3px 0">${day.name}</h2><div>${day.run}</div></div><span class="badge">${day.focus}</span></div></div><div class="card"><div class="stat"><div><span class="muted small">READINESS</span><div class="big">${r}</div></div><div class="ring" style="--p:${r}"><strong>${r}</strong></div></div><div class="small muted">Based on sleep + self-report. It guides attention; it does not override your coach or clinician.</div></div><div class="card"><span class="muted small">CURRENT BLOCK</span><h2 style="margin:4px 0">${phase.name}</h2><div>${phase.priority}</div><div class="bar"><i style="width:${phaseProgress(phase)}%"></i></div></div></div>
${risk.length?`<div class="card" style="margin-top:13px"><h2>Attention</h2>${risk.slice(0,3).map(x=>`<div class="notice ${x.level}"><strong>${x.title}</strong><div class="small">${x.text}</div></div>`).join('')}</div>`:''}
<div class="two" style="margin-top:13px"><div class="card"><h2>Today, in order</h2><div class="timeline">${timeline}</div></div><div class="grid"><div class="card"><h2>Second session</h2><p>${day.double}</p><div class="notice ${[1,3].includes(dow)?'green':'yellow'}"><strong>${phase.name}</strong><div class="small">${phase.xt}</div></div><button class="btn secondary" id="logDouble">Log bike / elliptical</button></div><div class="card"><h2>Mobility + balance</h2>${microRoutine().map(x=>`<div class="small" style="padding:5px 0">• ${x}</div>`).join('')}<div class="small muted" style="margin-top:7px">This is a micro-dose, not a workout. Follow your physio's exercise selection/dose where it differs.</div></div><div class="card"><h2>Today’s sessions</h2>${todayWs.length?todayWs.map(w=>`<div class="split" style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span>${w.slot||''} ${w.type} · ${w.purpose||''}</span><strong>${w.duration?Math.round(w.duration)+' min':''}</strong></div>`).join(''):'<span class="muted">Nothing logged yet.</span>'}</div></div></div>`;
document.querySelectorAll('[data-task]').forEach(c=>c.onchange=async()=>{const rec=await todayData();rec.tasks=rec.tasks||{};rec.tasks[c.dataset.task]=c.checked;await put('daily',rec)});document.querySelector('#logDouble').onclick=()=>{openTab('logTab');setTimeout(()=>{const t=document.querySelector('[name=type]');if(t)t.value='Bike';const s=document.querySelector('[name=slot]');if(s)s.value='PM';const p=document.querySelector('[name=purpose]');if(p)p.value='Recovery'},50)}}
async function renderLog(){const [d,ws]=await Promise.all([todayData(),all('workouts')]);const recent=ws.sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));document.querySelector('#logTab').innerHTML=`<div class="two"><form class="card" id="checkForm"><h2>Morning / daily check-in</h2><div class="row">${num('Sleep hours','sleep',d.sleep,'0','14','.1')}${num('Resting HR','rhr',d.rhr,'25','140','1')}</div><div class="row">${num('Energy 1–5','energy',d.energy,'1','5','1')}${num('Soreness 1–5','soreness',d.soreness,'1','5','1')}</div><div class="row">${num('Stress 1–5','stress',d.stress,'1','5','1')}${num('Pain 0–10','pain',d.pain,'0','10','1')}</div><div class="row">${num('Motivation 1–5','motivation',d.motivation,'1','5','1')}${num('Body mass kg (optional)','weight',d.weight,'30','150','.1')}</div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Illness, school stress, foot/Achilles, unusual fatigue…">${esc(d.notes||'')}</textarea></div><button class="btn">Save check-in</button></form>
<form class="card" id="workForm"><h2>Log a session</h2><div class="row"><div class="field"><label>Date</label><input type="date" name="date" value="${localDate()}" required></div><div class="field"><label>Slot</label><select name="slot"><option>AM</option><option selected>PM</option><option>Midday</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Type</label><select name="type">${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Purpose</label><select name="purpose">${PURPOSES.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="row">${num('Distance km','distance','','0','80','.1')}${num('Duration min','duration','','0','360','1')}</div><div class="row">${num('Average HR','avgHr','','30','230','1')}${num('Max HR','maxHr','','30','230','1')}</div><div class="row">${num('RPE 1–10','rpe','','1','10','1')}${num('Pain after 0–10','painAfter','','0','10','1')}</div><div class="field"><label>Details / splits</label><textarea name="notes" placeholder="Reps, recoveries, surface, shoes, weather, how you felt…"></textarea></div><button class="btn">Save session</button></form></div>
<div class="card" style="margin-top:13px"><h2>Recent sessions</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Slot</th><th>Type</th><th>Purpose</th><th>km</th><th>min</th><th>RPE</th><th></th></tr></thead><tbody>${recent.slice(0,50).map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.slot||'—'}</td><td>${w.type}</td><td>${w.purpose||''}</td><td>${w.distance??''}</td><td>${w.duration??''}</td><td>${w.rpe??''}</td><td><button class="btn secondary sm" data-del="${w.id}">×</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">No sessions logged.</td></tr>'}</tbody></table></div></div>`;
document.querySelector('#checkForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),rec=await todayData();['sleep','rhr','energy','soreness','stress','pain','motivation','weight'].forEach(k=>rec[k]=f.get(k)===''?null:+f.get(k));rec.notes=f.get('notes');await put('daily',rec);await renderSystem();alert('Check-in saved.')};
document.querySelector('#workForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('workouts',{id:crypto.randomUUID(),date:f.get('date'),slot:f.get('slot'),type:f.get('type'),purpose:f.get('purpose'),distance:f.get('distance')?+f.get('distance'):null,duration:f.get('duration')?+f.get('duration'):null,avgHr:f.get('avgHr')?+f.get('avgHr'):null,maxHr:f.get('maxHr')?+f.get('maxHr'):null,rpe:f.get('rpe')?+f.get('rpe'):null,painAfter:f.get('painAfter')?+f.get('painAfter'):null,notes:f.get('notes')});renderLog()};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this session?')){await del('workouts',b.dataset.del);renderLog()}})}
function windowData(rows,start,end,dateKey='date'){return rows.filter(x=>x[dateKey]>=start&&x[dateKey]<=end)}
function pct(a,b){return b?((a-b)/b*100):null}
function hard(w){return ['Threshold','Aerobic power','1500 pace','800 pace','Speed','Hills','Race'].includes(w.purpose)||w.type==='Race'||(+w.rpe>=7)}
function smartFlags(ds,ws,p){const flags=[],d7=windowData(ws,daysAgo(6),localDate()),prev7=windowData(ws,daysAgo(13),daysAgo(7)),km7=sum(d7.filter(x=>x.type==='Run'||x.type==='Race').map(x=>x.distance)),kmPrev=sum(prev7.filter(x=>x.type==='Run'||x.type==='Race').map(x=>x.distance)),load7=sum(d7.map(x=>(+x.duration||0)*(+x.rpe||0))),loadPrev=sum(prev7.map(x=>(+x.duration||0)*(+x.rpe||0))),recentD=ds.filter(x=>x.id>=daysAgo(6)),sleep=avg(recentD.map(x=>+x.sleep).filter(Boolean)),pain=recentD.map(x=>+x.pain).filter(x=>Number.isFinite(x));if(kmPrev>15&&pct(km7,kmPrev)>20)flags.push({level:'yellow',title:'Running load rose quickly',text:`${kmPrev.toFixed(1)} → ${km7.toFixed(1)} km over consecutive 7-day windows. Treat this as a prompt to review the increase, not a prediction of injury.`});if(loadPrev>300&&pct(load7,loadPrev)>25)flags.push({level:'yellow',title:'Total training stress is up',text:`Session-RPE load increased ${Math.round(pct(load7,loadPrev))}%. Check whether recovery and quality-session performance are holding.`});if(sleep&&sleep<p.sleepTarget-.6)flags.push({level:'yellow',title:'Sleep is below your target',text:`7-day average ${sleep.toFixed(1)} h versus ${p.sleepTarget} h target.`});if(pain.length&&Math.max(...pain)>=3)flags.push({level:'red',title:'Pain signal',text:`You logged pain ≥3/10 this week. Do not let a streak or planned double override symptom management.`});const hardDates=[...new Set(d7.filter(hard).map(x=>x.date))].sort();for(let i=2;i<hardDates.length;i++){const a=new Date(hardDates[i-2]),b=new Date(hardDates[i]);if((b-a)/86400000<=2){flags.push({level:'yellow',title:'Dense hard-load cluster',text:'Three hard-load days occurred inside three calendar days. Check whether this was planned around racing.'});break}}return flags}
function trendStats(ds,ws){const d7=windowData(ws,daysAgo(6),localDate()),p7=windowData(ws,daysAgo(13),daysAgo(7)),d28=windowData(ws,daysAgo(27),localDate()),daily28=ds.filter(x=>x.id>=daysAgo(27)),run=x=>x.filter(w=>w.type==='Run'||w.type==='Race'),xt=x=>x.filter(w=>['Bike','Elliptical'].includes(w.type)),km7=sum(run(d7).map(w=>w.distance)),kmP=sum(run(p7).map(w=>w.distance)),load7=sum(d7.map(w=>(+w.duration||0)*(+w.rpe||0))),loadP=sum(p7.map(w=>(+w.duration||0)*(+w.rpe||0))),xtMin=sum(xt(d28).map(w=>w.duration)),runMin=sum(run(d28).map(w=>w.duration)),sleep=avg(daily28.map(x=>+x.sleep).filter(Boolean)),pain=avg(daily28.map(x=>+x.pain).filter(x=>Number.isFinite(x))),easy=d28.filter(w=>(w.type==='Run')&&['Easy','Recovery','Long run'].includes(w.purpose)&&w.avgHr&&w.distance&&w.duration);return {km7,kmP,load7,loadP,xtMin,runMin,sleep,pain,easy}}
function efficiency(w){const speed=w.distance/(w.duration/60);return speed/w.avgHr}
function smartInsights(ds,ws,p){const s=trendStats(ds,ws),out=[];const recentEasy=s.easy.filter(x=>x.date>=daysAgo(13)),oldEasy=s.easy.filter(x=>x.date<daysAgo(13));if(recentEasy.length>=2&&oldEasy.length>=2){const a=avg(recentEasy.map(efficiency)),b=avg(oldEasy.map(efficiency)),d=pct(a,b);out.push({title:'Easy-run efficiency',value:`${d>=0?'+':''}${d.toFixed(1)}%`,text:'Recent 14 days versus earlier comparable easy runs in the 28-day window. Higher is generally better, but heat, hills and HR measurement affect this.',good:d>0})}out.push({title:'7-day running',value:`${s.km7.toFixed(1)} km`,text:s.kmP?`${pct(s.km7,s.kmP)>=0?'+':''}${pct(s.km7,s.kmP).toFixed(0)}% versus previous 7 days.`:'Build a few weeks of data for comparison.'});out.push({title:'7-day sRPE load',value:Math.round(s.load7),text:s.loadP?`${pct(s.load7,s.loadP)>=0?'+':''}${pct(s.load7,s.loadP).toFixed(0)}% versus previous 7 days. Use as context, not a magic safe-load number.`:'Duration × RPE across logged sessions.'});out.push({title:'28-day cross-training',value:`${Math.round(s.xtMin)} min`,text:`Running time ${Math.round(s.runMin)} min. Cross-training is counted as training load even when mechanical load is lower.`});out.push({title:'28-day sleep',value:s.sleep?`${s.sleep.toFixed(1)} h`:'—',text:s.sleep?`Target ${p.sleepTarget} h. Daily self-report is intentionally part of the monitoring system.`:'Log sleep to populate this.'});out.push({title:'28-day pain',value:s.pain!=null?s.pain.toFixed(1):'—',text:'Average daily pain score. Also pay attention to spikes and changed mechanics rather than the average alone.'});return out}
async function renderTrends(){const [ds,ws,p]=await Promise.all([all('daily'),all('workouts'),setting('profile',PROFILE_DEFAULT)]),ins=smartInsights(ds,ws,p),flags=smartFlags(ds,ws,p);document.querySelector('#trendsTab').innerHTML=`<div class="g3 grid">${ins.map(i=>`<div class="card"><span class="muted small">${i.title.toUpperCase()}</span><div class="big">${i.value}</div><div class="small muted">${i.text}</div></div>`).join('')}</div><div class="g2 grid" style="margin-top:13px"><div class="card"><h2>Smart review</h2>${flags.length?flags.map(x=>`<div class="notice ${x.level}"><strong>${x.title}</strong><div class="small">${x.text}</div></div>`).join(''):'<div class="notice green"><strong>No obvious flags from the data you have logged.</strong><div class="small">This does not mean zero injury risk; it means Trackline has no simple pattern to flag right now.</div></div>'}<div class="notice"><strong>How to use this:</strong><div class="small">Look for repeated associations over several weeks — e.g. poor Thursday sessions after low sleep, pain spikes after mileage increases, or better easy-run efficiency at the same HR. Trackline should prompt questions, not invent causation.</div></div></div><div class="card"><h2>Recent load</h2><div class="canvasWrap"><canvas id="loadChart"></canvas></div><div class="small muted">Daily session-RPE load (duration × RPE), last 28 days.</div></div></div>`;drawLoadChart(ws)}
function drawLoadChart(ws){const c=document.querySelector('#loadChart');if(!c)return;const ratio=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*ratio;c.height=h*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);const vals=[];for(let i=27;i>=0;i--){const d=daysAgo(i);vals.push(sum(ws.filter(s=>s.date===d).map(s=>(+s.duration||0)*(+s.rpe||0))))}const max=Math.max(...vals,100);x.clearRect(0,0,w,h);x.strokeStyle='#2a3850';x.beginPath();x.moveTo(0,h-25);x.lineTo(w,h-25);x.stroke();const bw=Math.max(3,w/28-3);vals.forEach((v,i)=>{const bh=(h-38)*v/max;x.fillStyle='#7ea7ff';x.fillRect(i*w/28+1,h-25-bh,bw,bh)});x.fillStyle='#8190a7';x.font='11px system-ui';x.fillText('28 days ago',2,h-6);x.fillText('today',w-33,h-6)}
function bestLatest(bs,type){return bs.filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0]}
function metricDisplay(x){if(!x)return '—';if(['1500 time','800 time','3000 time','5k time'].includes(x.type))return secTime(x.value);if(x.type==='Threshold pace')return secTime(x.value)+'/km';return `${x.value} ${METRICS.find(m=>m[0]===x.type)?.[1]||''}`}
function perfScores(ds,ws,bs){const d28=ds.filter(x=>x.id>=daysAgo(27)),w28=ws.filter(x=>x.date>=daysAgo(27)),sleep=avg(d28.map(x=>+x.sleep).filter(Boolean))||7.5,pain=avg(d28.map(x=>+x.pain).filter(x=>Number.isFinite(x)))||0,runDays=new Set(w28.filter(x=>x.type==='Run'||x.type==='Race').map(x=>x.date)).size,hardDays=new Set(w28.filter(hard).map(x=>x.date)).size,threshold=bestLatest(bs,'Threshold pace'),speed=bestLatest(bs,'Max speed'),race=bestLatest(bs,'1500 time');return {'Engine':clamp(52+runDays*.8+hardDays*1.2+(threshold?6:0),35,92),'Speed':clamp(50+(speed?Math.min(25,(speed.value-24)*3):6)+hardDays*.5,35,93),'1500 specific':clamp(48+hardDays*1.3+(race?8:0),35,93),'Durability':clamp(90-pain*12+Math.min(8,runDays*.3),25,96),'Recovery':clamp(35+sleep*6.2-pain*3,30,96),'Consistency':clamp(35+runDays*2,35,96)}}
async function renderPerformance(){const [ds,ws,bs]=await Promise.all([all('daily'),all('workouts'),all('benchmarks')]);bs.sort((a,b)=>b.date.localeCompare(a.date));const scores=perfScores(ds,ws,bs);document.querySelector('#perfTab').innerHTML=`<div class="card"><h2>Performance profile</h2><p class="muted">These development scores are dashboard indicators, not physiological measurements. Real performance metrics only change when you log a real test.</p><div class="g3 grid">${Object.entries(scores).map(([k,v])=>`<div class="metric"><div class="stat"><strong>${k}</strong><strong>${v.toFixed(0)}</strong></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}</div></div><div class="two" style="margin-top:13px"><form class="card" id="benchForm"><h2>Add a benchmark</h2><div class="field"><label>Metric</label><select name="type">${METRICS.map(m=>`<option>${m[0]}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Date</label><input type="date" name="date" value="${localDate()}" required></div>${num('Value','value','','0','','.01')}</div><div class="field"><label>Confidence</label><select name="confidence"><option>High — race/lab/electronic timing</option><option>Medium — standardised field test</option><option>Low — watch estimate / rough test</option></select></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn">Save benchmark</button><div class="notice">Enter race/pace times as seconds. Example 3:57.48 = 237.48.</div></form><div class="card"><h2>Latest measured stats</h2>${METRICS.slice(0,12).map(m=>{const x=bestLatest(bs,m[0]);return `<div class="split" style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span>${m[0]}</span><strong>${metricDisplay(x)}</strong></div>`}).join('')}</div></div><div class="card" style="margin-top:13px"><h2>Test history</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Metric</th><th>Value</th><th>Confidence</th><th></th></tr></thead><tbody>${bs.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${x.type}</td><td>${metricDisplay(x)}</td><td>${x.confidence?.split('—')[0]||''}</td><td><button class="btn secondary sm" data-db="${x.id}">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No tests logged.</td></tr>'}</tbody></table></div></div>`;document.querySelector('#benchForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('benchmarks',{id:crypto.randomUUID(),date:f.get('date'),type:f.get('type'),value:+f.get('value'),confidence:f.get('confidence'),notes:f.get('notes')});renderPerformance()};document.querySelectorAll('[data-db]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this benchmark?')){await del('benchmarks',b.dataset.db);renderPerformance()}})}
async function renderPlan(){const p=await setting('profile',PROFILE_DEFAULT),cp=phaseFor();document.querySelector('#planTab').innerHTML=`<div class="two"><div class="card"><h2>September → next track season</h2>${PHASES.map(x=>`<div class="phase ${x.name===cp.name?'current':''}"><strong>${x.name}</strong><div class="small muted">${fmtDate(x.start)} → ${fmtDate(x.end)}</div><div>${x.priority}</div><div class="small" style="margin-top:5px"><strong>Cross-training:</strong> ${x.xt}</div></div>`).join('')}</div><form class="card" id="profileForm"><h2>Targets</h2><div class="field"><label>Season goal</label><input name="goalText" value="${esc(p.goalText)}"></div><div class="field"><label>1500 goal</label><input name="goal1500" value="${esc(p.goal1500)}" placeholder="e.g. 3:50.xx"></div><div class="field"><label>Coach-agreed weekly km range/target</label><input name="weeklyKm" value="${esc(p.weeklyKm)}" placeholder="e.g. 55–65; not a quota"></div><div class="field"><label>Sleep target (h)</label><input type="number" name="sleepTarget" min="7" max="11" step=".25" value="${p.sleepTarget}"></div><button class="btn">Save</button><div class="notice yellow"><strong>Trackline never awards points for extra mileage.</strong><div class="small">The purpose is consistent execution and adaptation, not accumulating work for its own sake.</div></div></form></div><div class="card" style="margin-top:13px"><h2>Weekly framework</h2><div class="scroll"><table><thead><tr><th>Day</th><th>Main work</th><th>Second session</th></tr></thead><tbody>${[1,2,3,4,5,6,0].map(i=>`<tr><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</td><td><strong>${WEEK[i].name}</strong><br><span class="small muted">${WEEK[i].run}</span></td><td class="small">${WEEK[i].double}</td></tr>`).join('')}</tbody></table></div></div>`;document.querySelector('#profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await setSetting('profile',{...p,goalText:f.get('goalText'),goal1500:f.get('goal1500'),weeklyKm:f.get('weeklyKm'),sleepTarget:+f.get('sleepTarget')});renderPlan()}}
function routine(title,items,note=''){return `<div class="libraryItem"><h3>${title}</h3>${items.map(x=>`<div class="small" style="padding:3px 0">• ${x}</div>`).join('')}${note?`<div class="small muted" style="margin-top:5px">${note}</div>`:''}</div>`}
async function renderLibrary(){document.querySelector('#libraryTab').innerHTML=`<div class="g2 grid"><div class="card"><h2>Before running</h2>${routine('Easy / recovery run',['2–4 min of ankle + hip movement','Start the first 5–10 min deliberately easy','Strides only if scheduled or appropriate'])}${routine('Quality session / race',['Carbohydrate-rich meal 2–4 h beforehand','Top-up carbohydrate 45–90 min beforehand if useful','10–15 min easy running','Dynamic mobility and drills','4–6 progressive strides with enough recovery'])}${routine('Hot conditions',['Start hydrated','Bring fluid where practical','Adjust expectations for heat rather than forcing normal splits'])}</div><div class="card"><h2>After running</h2>${routine('First hour',['Cool-down as prescribed','Carbohydrate + 20–30 g protein','Replace fluid; include sodium when sweating heavily','Log RPE, pain and meaningful session details'])}${routine('Later that day',['Normal carbohydrate-rich meals','Protein distributed across the day','Short mobility only if useful','Prepare tomorrow rather than adding training'])}</div><div class="card"><h2>Mobility + balance</h2>${routine('8–12 minute micro-dose',microRoutine(),'Low fatigue. Consistency beats making this a workout.')}${routine('Running mechanics support',['Foot tripod / controlled toe work','Single-leg balance and reach','Ankle dorsiflexion control','Hip extension/rotation mobility','Calf + soleus capacity through your prescribed strength plan'])}</div><div class="card"><h2>Cross-training doubles</h2>${routine('Easy double',['Bike or elliptical','20–40 min to begin with','RPE 2–3 / conversational','Separate from run by ~6 h when practical','Eat between sessions; the second session still requires fuel'])}${routine('Do not turn it into',['Threshold because you felt good','Hard intervals on an easy/recovery day','A way to replace a true Friday rest day','A quota that compromises Tue/Thu/Sat quality'], 'Cross-training lowers impact but still creates cardiovascular and muscular training stress.')}</div><div class="card"><h2>Plant-forward performance basics</h2>${routine('Daily anchors',['Carbohydrate at every main meal','A strong protein source 4+ times/day','Calcium-rich foods / fortified alternatives','Iron-rich foods paired with vitamin C','B12 source/supplement if fully vegan','Energy-dense foods when high fibre makes it hard to eat enough'])}${routine('Before hard training',['Prefer lower-fibre, familiar carbohydrates if your stomach is sensitive','Do not arrive hungry because the meal looked “healthy” but was too small'])}</div><div class="card"><h2>When something feels wrong</h2>${routine('Respond early',['Record location and pain score','Notice whether mechanics changed','Replace/modify load according to your coach/physio plan','Do not use cross-training as permission for another hard day','Escalate recurrent/worsening symptoms to your clinician'])}</div></div>`}
async function storageInfo(){const o={persisted:null,usage:null};try{if(navigator.storage?.persisted)o.persisted=await navigator.storage.persisted();if(navigator.storage?.estimate)o.usage=(await navigator.storage.estimate()).usage||0}catch{}return o}function bytes(n){if(n==null)return '—';return n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`}
async function renderSettings(){const [p,meta,st,ds,ws,bs]=await Promise.all([setting('profile',PROFILE_DEFAULT),setting('meta',{}),storageInfo(),all('daily'),all('workouts'),all('benchmarks')]);const last=meta.lastBackupAt?new Date(meta.lastBackupAt):null,age=last?Math.floor((Date.now()-last)/86400000):null;document.querySelector('#settingsTab').innerHTML=`<div class="g2 grid"><div class="card"><h2>Backup</h2><p class="muted">Your database is local to this site/app. Keep a copy outside the browser.</p><div class="row"><button class="btn" id="export">Download backup</button><button class="btn secondary" id="csv">Export CSVs</button></div><div class="notice ${age==null||age>7?'yellow':'green'}">${last?`Last backup ${age} day${age===1?'':'s'} ago.`:'No backup recorded yet.'}</div><div class="field"><label>Restore JSON backup</label><input id="restoreFile" type="file" accept=".json,application/json"></div><label class="taskline"><input id="replace" type="checkbox" checked><span>Replace current database when restoring</span></label><button class="btn secondary" id="restore">Restore</button></div><div class="card"><h2>App</h2><table><tr><td>Version</td><td>${VERSION}</td></tr><tr><td>Daily logs</td><td>${ds.length}</td></tr><tr><td>Sessions</td><td>${ws.length}</td></tr><tr><td>Benchmarks</td><td>${bs.length}</td></tr><tr><td>Persistent storage</td><td>${st.persisted===true?'Enabled':st.persisted===false?'Not granted':'Unknown'}</td></tr><tr><td>Storage used</td><td>${bytes(st.usage)}</td></tr></table><div class="row" style="margin-top:11px"><button class="btn secondary" id="persist">Protect storage</button><button class="btn secondary" id="install">Install app</button></div><div class="notice">Uploading a newer Trackline version to the same GitHub Pages URL updates the app files; it does not intentionally replace this IndexedDB database.</div></div></div><div class="card" style="margin-top:13px"><h2>Reset</h2><button class="btn dangerbtn" id="wipe">Delete all local data</button></div>`;document.querySelector('#export').onclick=backup;document.querySelector('#csv').onclick=exportCsv;document.querySelector('#restore').onclick=restore;document.querySelector('#persist').onclick=persist;document.querySelector('#install').onclick=install;document.querySelector('#wipe').onclick=wipe}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
async function backup(){const payload={app:'Trackline',format:3,version:VERSION,exportedAt:new Date().toISOString(),daily:await all('daily'),workouts:await all('workouts'),benchmarks:await all('benchmarks'),settings:await all('settings')};download(`trackline-backup-${localDate()}.json`,JSON.stringify(payload,null,2),'application/json');const m=await setting('meta',{});m.lastBackupAt=new Date().toISOString();await setSetting('meta',m);renderSystem();renderSettings()}
function csv(rows){if(!rows.length)return '';const ks=[...new Set(rows.flatMap(Object.keys))];const q=v=>`"${String(v??'').replaceAll('"','""')}"`;return [ks.join(','),...rows.map(r=>ks.map(k=>q(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(','))].join('\n')}
async function exportCsv(){for(const [n,s] of [['daily','daily'],['sessions','workouts'],['benchmarks','benchmarks']])download(`trackline-${n}-${localDate()}.csv`,csv(await all(s)),'text/csv')}
async function clearAll(){for(const s of ['daily','workouts','benchmarks','settings'])await new Promise((res,rej)=>{const tx=db.transaction(s,'readwrite');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.objectStore(s).clear()})}
async function restore(){const f=document.querySelector('#restoreFile').files[0];if(!f)return alert('Choose a JSON backup first.');let p;try{p=JSON.parse(await f.text())}catch{return alert('Invalid JSON file.')}if(!Array.isArray(p.daily)||!Array.isArray(p.workouts)||!Array.isArray(p.benchmarks)||!Array.isArray(p.settings))return alert('This is not a recognised Trackline backup.');if(!confirm(document.querySelector('#replace').checked?'Replace the current database?':'Merge this backup into the current database?'))return;if(document.querySelector('#replace').checked)await clearAll();for(const [s,rows] of [['daily',p.daily],['workouts',p.workouts],['benchmarks',p.benchmarks],['settings',p.settings]])for(const x of rows)await put(s,x);await defaults();alert('Backup restored.');renderSettings();renderSystem()}
async function wipe(){if(!confirm('Delete all local Trackline data? Download a backup first if needed.'))return;await clearAll();await defaults();renderSettings();renderSystem()}
async function persist(){if(!navigator.storage?.persist)return alert('This browser does not support persistent-storage requests. Keep regular backups.');const ok=await navigator.storage.persist();alert(ok?'Persistent storage enabled.':'The browser did not grant persistent storage. Your data still saves locally; keep regular backups.');renderSettings();renderSystem()}
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}async function install(){if(standalone())return alert('Trackline is already installed.');if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;return}if(/iphone|ipad|ipod/i.test(navigator.userAgent))return alert('On iPhone/iPad: open Trackline in Safari → Share → Add to Home Screen → Open as Web App → Add.');alert('Use the browser menu → Install app / Add to Home Screen.')}
async function renderSystem(){const m=await setting('meta',{}),st=await storageInfo(),last=m.lastBackupAt?new Date(m.lastBackupAt):null,age=last?Math.floor((Date.now()-last)/86400000):null;document.querySelector('#system').innerHTML=`<span class="pill">v${VERSION}</span><span class="pill">${navigator.onLine?'Online':'Offline'}</span><span class="pill">${st.persisted?'Storage protected':'Local storage'}</span><span class="pill ${age==null||age>7?'warn':''}">${last?`Backup ${age}d ago`:'Backup needed'}</span>${standalone()?'':'<button id="quickInstall" class="pill">Install</button>'}`;document.querySelector('#quickInstall')?.addEventListener('click',install)}
function updateBanner(reg){waitingWorker=reg.waiting;document.querySelector('#updateBanner').classList.add('show')}
async function serviceWorker(){if(!('serviceWorker'in navigator)||!location.protocol.startsWith('http'))return;try{const reg=await navigator.serviceWorker.register('./sw.js');if(reg.waiting)updateBanner(reg);reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)updateBanner(reg)})});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());setInterval(()=>reg.update().catch(()=>{}),3600000)}catch(e){console.warn(e)}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;renderSystem()});window.addEventListener('online',renderSystem);window.addEventListener('offline',renderSystem);document.querySelector('#applyUpdate').onclick=()=>waitingWorker?waitingWorker.postMessage({type:'SKIP_WAITING'}):location.reload();
async function start(){await dbOpen();await defaults();navInit();await renderToday();await renderSystem();serviceWorker()}start();
</script>
