<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Local-first middle-distance performance tracker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <title>Trackline — 1500 Development</title>
  <style>
    :root {
      --bg:#080b13; --panel:#111726; --panel2:#171f31; --text:#f6f7fb; --muted:#9fa9be;
      --accent:#70e1b2; --accent2:#78a8ff; --warn:#ffcc66; --danger:#ff7b86; --good:#78e08f;
      --border:#27314a; --shadow:0 12px 32px rgba(0,0,0,.28); --radius:18px;
    }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#080b13 0,#0c1120 100%);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{max-width:1180px;margin:auto;padding:18px 16px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .pill{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:999px;background:#152033;border:1px solid var(--border);font-size:12px;color:#dfe6f4}
    nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:10px 0 14px;background:linear-gradient(180deg,rgba(8,11,19,.98),rgba(8,11,19,.84),transparent)}
    nav button{border:1px solid var(--border);background:#111827;color:#cbd5e1;border-radius:12px;padding:9px 12px;white-space:nowrap} nav button.active{background:var(--accent);color:#07130f;border-color:transparent;font-weight:700}
    .grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:linear-gradient(180deg,var(--panel),#0f1522);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:17px}.card h3{font-size:14px;color:#dbe5f6}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:32px;font-weight:800;letter-spacing:-.03em}
    .stat{display:flex;align-items:end;justify-content:space-between;gap:10px}.bar{height:9px;background:#263047;border-radius:20px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:inherit}
    .quest{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.quest:last-child{border-bottom:0}.quest input{width:20px;height:20px;accent-color:var(--accent)}
    .xp{font-weight:800;color:var(--accent)}.danger{color:var(--danger)}.good{color:var(--good)}.warn{color:var(--warn)}
    .readiness{display:flex;align-items:center;gap:14px}.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--pct)*1%),#263047 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel)}.ring strong{z-index:1;font-size:24px}
    label{display:block;color:#cbd5e1;font-size:12px;margin-bottom:5px}.field{margin-bottom:12px}.field input,.field select,.field textarea{width:100%;background:#0b1020;border:1px solid var(--border);border-radius:11px;color:white;padding:10px 11px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--accent);color:#07130f;font-weight:800}.btn.secondary{background:#1c2740;color:#e6edf8;border:1px solid var(--border)}.btn.dangerbtn{background:#3a1820;color:#ffdce0;border:1px solid #63303b}.btn:disabled{opacity:.5;cursor:not-allowed}
    .notice{padding:11px 12px;border-radius:12px;background:#17243a;border:1px solid #2b4264;color:#dce9ff;margin:10px 0}.notice.red{background:#30191e;border-color:#6a303a}.notice.yellow{background:#2a2416;border-color:#66532d}.notice.green{background:#13291f;border-color:#2f6a4d}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid rgba(255,255,255,.07)}th{color:#9eabc1;font-weight:600}.scroll{overflow:auto}
    .badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#1b2840;color:#d9e6ff}.phase{padding:12px;border-left:4px solid var(--accent2);background:#121b2c;border-radius:10px;margin-bottom:8px}.phase.current{border-left-color:var(--accent);background:#14251f}
    .tabs{display:none}.tabs.active{display:block}.twoCol{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.footerNote{margin:24px 0;color:#7f8ba1;font-size:12px;text-align:center}
    .metric-card{padding:12px;background:#101827;border:1px solid var(--border);border-radius:14px}.systemBar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.systemBar .pill{background:#101827}.updateBanner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;width:min(620px,calc(100% - 24px));background:#eaf7f1;color:#0e211a;border:1px solid #9fd7c0;border-radius:14px;padding:12px 14px;box-shadow:0 18px 50px rgba(0,0,0,.4);display:none;align-items:center;gap:12px}.updateBanner.show{display:flex}.updateBanner .btn{margin-left:auto}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.metric-title{display:flex;justify-content:space-between;gap:8px}.trend{font-weight:800}.up{color:var(--good)}.neutral{color:var(--muted)}
    @media(max-width:820px){.g4,.g3,.g2,.twoCol{grid-template-columns:1fr}.app{padding:12px 12px 90px}.top{align-items:flex-start}.desktopOnly{display:none}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Trackline</h1><p>1500 development · training, recovery and testing</p></div>
    <div id="phasePill" class="pill">Season loading…</div>
  </header>
  <div id="systemBar" class="systemBar"></div>
  <nav id="nav"></nav>

  <section id="dashboard" class="tabs active"></section>
  <section id="daily" class="tabs"></section>
  <section id="training" class="tabs"></section>
  <section id="character" class="tabs"></section>
  <section id="benchmarks" class="tabs"></section>
  <section id="season" class="tabs"></section>
  <section id="data" class="tabs"></section>
  <p class="footerNote">Training support only. Medical and injury decisions stay with your coach, physio or clinician.</p>
</div>
<div id="updateBanner" class="updateBanner"><strong>Update available</strong><span class="small">Refresh to load the latest version. Your saved training data will stay in place.</span><button id="applyUpdate" class="btn">Update</button></div>
<script>
const APP_VERSION='2.0.0';
const NAV=[['dashboard','Today'],['daily','Check-in'],['training','Training'],['character','Profile'],['benchmarks','Testing'],['season','Plan'],['data','Settings']];
const DEFAULT_SCHEDULE={
  0:{name:'Long aerobic run',focus:'Engine',tasks:['Complete coach-prescribed long run','Keep effort controlled unless coach says otherwise','Post-run carbohydrate + protein','Log duration, distance, HR/RPE and pain response']},
  1:{name:'Easy + strength',focus:'Durability',tasks:['Complete easy run as prescribed','Complete scheduled strength / calf-soleus work','Eat regular meals + recovery protein','Arrive at Tuesday feeling better, not tired']},
  2:{name:'Primary session',focus:'1500 Power',tasks:['Complete coach-prescribed quality session','Fuel 2–4 h before session','Recovery carbs + protein after session','Log reps, RPE, conditions and pain']},
  3:{name:'Absorb',focus:'Recovery',tasks:['Complete genuinely easy recovery running only as prescribed','No secret tempo / extra hard cross-training','Complete rehab if scheduled','Prioritise food and sleep']},
  4:{name:'Secondary session',focus:'Engine',tasks:['Complete coach-prescribed session','Fuel before session','Recovery carbs + protein after session','Log performance, RPE and pain']},
  5:{name:'Full regen',focus:'Recovery',tasks:['Full rest from running unless coach changed plan','Rehab only if prescribed','Eat adequately despite lower training load','Prepare Saturday kit / food and aim for excellent sleep']},
  6:{name:'Third key day',focus:'Strength/Power',tasks:['Complete coach-prescribed session / hills / race','Fuel before training','Recovery carbs + protein after','Log purpose, RPE, performance and pain']}
};
const DEFAULT_PHASES=[
 {name:'Transition / reset',start:'2026-08-24',end:'2026-08-31',priority:'Recover, resolve niggles, restore freshness'},
 {name:'Durability base',start:'2026-09-01',end:'2026-10-31',priority:'Healthy running frequency, easy volume, threshold foundations, strength'},
 {name:'Aerobic strength',start:'2026-11-01',end:'2026-12-31',priority:'Threshold, hills, aerobic consistency, strength and durability'},
 {name:'Aerobic power + speed reserve',start:'2027-01-01',end:'2027-02-28',priority:'3k/5k strength, controlled speed, mechanics, maintain threshold'},
 {name:'1500 conversion',start:'2027-03-01',end:'2027-04-30',priority:'Race pace, speed endurance, fatigue resistance, specific finishing'},
 {name:'Track season',start:'2027-05-01',end:'2027-08-22',priority:'Race, recover, adapt; maintain engine, speed and durability'}
];
const DEFAULT_PROFILE={goal1500:'',goalText:'Breakthrough 1500m season',weeklyKm:'',sleepTarget:8.75};

let db;
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open('runnerRPG',3);r.onupgradeneeded=e=>{const d=e.target.result;['daily','workouts','benchmarks','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};r.onsuccess=()=>{db=r.result;resolve(db)};r.onerror=()=>reject(r.error);});}
function put(store,obj){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite').objectStore(store).put(obj);t.onsuccess=()=>res(obj);t.onerror=()=>rej(t.error);});}
function get(store,id){return new Promise((res,rej)=>{const t=db.transaction(store).objectStore(store).get(id);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
function all(store){return new Promise((res,rej)=>{const t=db.transaction(store).objectStore(store).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error);});}
function del(store,id){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite').objectStore(store).delete(id);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
const localDateKey=(d=new Date())=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;};
const today=()=>localDateKey();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmtDate=s=>new Date(s+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
async function setting(id,fallback){return (await get('settings',id))?.value ?? fallback;}
async function setSetting(id,value){return put('settings',{id,value});}
function calcReadiness(d,target=8.75){if(!d)return 75; let score=75; const sleep=+d.sleep||0; score+=clamp((sleep-target)*9,-20,7); score+=(+d.energy-3)*5; score-=(+d.soreness-2)*4; score-=(+d.stress-2)*3; score-=(+d.pain||0)*5; score+=(+d.motivation-3)*2; return Math.round(clamp(score,0,100));}
function sleepXP(h,target=8.75){if(h>=9)return 20;if(h>=8.5)return 18;if(h>=8)return 15;if(h>=7.5)return 10;return h?5:0;}
function dailyXP(d,profile){if(!d)return 0; let xp=0; const quests=d.quests||[]; const done=quests.filter(Boolean).length; xp+=Math.round((done/Math.max(quests.length,1))*50); xp+=sleepXP(+d.sleep||0,+profile.sleepTarget||8.75); xp+=d.fuelBreakfast?5:0; xp+=d.fuelPre?5:0; xp+=d.fuelPost?5:0; xp+=d.fuelDay?5:0; xp+=d.logged?10:0; return clamp(xp,0,100);}
function currentPhase(phases,date=today()){return phases.find(p=>date>=p.start&&date<=p.end)||null;}
async function initDefaults(){if(!await get('settings','profile'))await setSetting('profile',DEFAULT_PROFILE);if(!await get('settings','schedule'))await setSetting('schedule',DEFAULT_SCHEDULE);if(!await get('settings','phases'))await setSetting('phases',DEFAULT_PHASES);}

function navInit(){const n=document.querySelector('#nav');n.innerHTML=NAV.map(([id,label])=>`<button data-tab="${id}" class="${id==='dashboard'?'active':''}">${label}</button>`).join('');n.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tabs').forEach(x=>x.classList.remove('active'));document.querySelector('#'+b.dataset.tab).classList.add('active');renderTab(b.dataset.tab);};}
async function renderTab(id){({dashboard:renderDashboard,daily:renderDaily,training:renderTraining,character:renderCharacter,benchmarks:renderBenchmarks,season:renderSeason,data:renderData}[id]||(()=>{}))();}
async function renderDashboard(){
 const [daily,workouts,profile,schedule,phases,bench]=await Promise.all([all('daily'),all('workouts'),setting('profile',DEFAULT_PROFILE),setting('schedule',DEFAULT_SCHEDULE),setting('phases',DEFAULT_PHASES),all('benchmarks')]);
 const d=daily.find(x=>x.id===today()); const plan=schedule[new Date().getDay()]; const xp=dailyXP(d,profile); const readiness=calcReadiness(d,+profile.sleepTarget||8.75); const phase=currentPhase(phases);
 document.querySelector('#phasePill').textContent=phase?phase.name:'Outside season plan';
 const last7Keys=Array.from({length:7},(_,i)=>{const x=new Date();x.setDate(x.getDate()-i);return localDateKey(x)});const last7=last7Keys.map(k=>daily.find(x=>x.id===k)).filter(Boolean); const avgXP=Math.round(last7Keys.reduce((s,k)=>s+dailyXP(daily.find(x=>x.id===k),profile),0)/7);
 const painNow=d?+d.pain||0:0; const alert=painNow>=4?['red','High pain flag','Do not use XP as a reason to push through this. Modify training and contact your coach/physio if appropriate.']:painNow>=2?['yellow','Pain watch','Monitor response closely and keep the coach/physio informed if symptoms persist or rise.']:['green','No major pain flag','Keep building capacity and consistency.'];
 document.querySelector('#dashboard').innerHTML=`
 <div class="g4 grid">
  <div class="card"><div class="muted small">DAILY SCORE</div><div class="big">${xp}<span class="muted" style="font-size:16px">/100</span></div><div class="bar"><i style="width:${xp}%"></i></div></div>
  <div class="card"><div class="muted small">7-DAY EXECUTION</div><div class="big">${avgXP}</div><div class="muted small">average score</div></div>
  <div class="card"><div class="muted small">TODAY'S PLAN</div><div style="font-size:19px;font-weight:800;margin-top:5px">${plan.name}</div><div class="muted small">Focus: ${plan.focus}</div></div>
  <div class="card"><div class="muted small">HEALTH STATUS</div><div style="font-size:19px;font-weight:800;margin-top:5px" class="${painNow>=4?'danger':painNow>=2?'warn':'good'}">Pain ${painNow}/10</div><div class="muted small">daily symptom check</div></div>
 </div>
 <div class="twoCol" style="margin-top:14px">
  <div class="card"><h2>Today's quests</h2>${plan.tasks.map((q,i)=>`<div class="quest"><input type="checkbox" data-quest="${i}" ${d?.quests?.[i]?'checked':''}><div>${q}</div><div class="xp">+${Math.round(50/plan.tasks.length)} </div></div>`).join('')}<button class="btn secondary" id="openCheck" style="margin-top:12px">Open full check-in</button></div>
  <div class="card"><h2>Readiness</h2><div class="readiness"><div class="ring" style="--pct:${readiness}"><strong>${readiness}</strong></div><div><div style="font-weight:800">${readiness>=80?'Green light':readiness>=60?'Proceed thoughtfully':'Recovery signal'}</div><div class="muted small">Based on sleep, energy, soreness, stress, pain and motivation—not a medical clearance.</div></div></div><div class="notice ${alert[0]}"><strong>${alert[1]}</strong><br><span class="small">${alert[2]}</span></div></div>
 </div>
 <div class="g3 grid" style="margin-top:14px" id="charMini"></div>`;
 document.querySelectorAll('[data-quest]').forEach(cb=>cb.onchange=async()=>{let rec=await get('daily',today())||{id:today(),quests:[]};rec.quests=rec.quests||[];rec.quests[+cb.dataset.quest]=cb.checked;await put('daily',rec);renderDashboard();});
 document.querySelector('#openCheck').onclick=()=>{document.querySelector('button[data-tab="daily"]').click()};
 renderMiniCharacter(daily,workouts,bench);
}
function metricLatest(bench,type){return [...bench].filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date))[0];}
function computeCharacter(daily,workouts,bench){
 const last28=daily.filter(x=>new Date(x.id)>=new Date(Date.now()-27*86400000)); const adherence=last28.length?last28.reduce((s,d)=>s+(d.quests||[]).filter(Boolean).length/Math.max((d.quests||[]).length,1),0)/last28.length:0;
 const avgSleep=last28.length?last28.reduce((s,d)=>s+(+d.sleep||0),0)/last28.length:0; const avgPain=last28.length?last28.reduce((s,d)=>s+(+d.pain||0),0)/last28.length:0; const fueled=last28.length?last28.reduce((s,d)=>s+[d.fuelBreakfast,d.fuelPre,d.fuelPost,d.fuelDay].filter(Boolean).length/4,0)/last28.length:0;
 const run28=workouts.filter(w=>w.date>=new Date(Date.now()-27*86400000).toISOString().slice(0,10) && w.type==='Run'); const available=last28.length?last28.filter(d=>(+d.pain||0)<3).length/last28.length:1;
 const speed=metricLatest(bench,'Max speed'); const vo2=metricLatest(bench,'VO2max'); const broad=metricLatest(bench,'Broad jump'); const threshold=metricLatest(bench,'Threshold pace');
 return {
  'Engine':clamp(45+adherence*22+(vo2?clamp((+vo2.value-55)*1.1,0,22):8)+(threshold?8:0),0,100),
  'Speed':clamp(45+(speed?clamp((+speed.value-24)*4,0,35):10)+(broad?10:5)+adherence*8,0,100),
  '1500 Power':clamp(42+adherence*20+(metricLatest(bench,'1500m')?18:8)+(metricLatest(bench,'800m')?12:5),0,100),
  'Durability':clamp(40+available*35+adherence*20-avgPain*5,0,100),
  'Strength/Power':clamp(45+(broad?20:8)+adherence*18,0,100),
  'Recovery':clamp(35+Math.min(avgSleep/9,1)*40+adherence*18-avgPain*2,0,100),
  'Fuel':clamp(35+fueled*55+adherence*5,0,100)
 };
}
async function renderMiniCharacter(daily,workouts,bench){const c=computeCharacter(daily,workouts,bench);document.querySelector('#charMini').innerHTML=Object.entries(c).slice(0,6).map(([k,v])=>`<div class="card"><div class="stat"><strong>${k}</strong><strong>${v.toFixed(1)}</strong></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('');}

async function renderDaily(){const [d,profile,schedule]=await Promise.all([get('daily',today()),setting('profile',DEFAULT_PROFILE),setting('schedule',DEFAULT_SCHEDULE)]); const plan=schedule[new Date().getDay()];
 document.querySelector('#daily').innerHTML=`<div class="twoCol"><form class="card" id="checkForm"><h2>Morning / daily check-in</h2><div class="g2 grid">
 ${numField('Sleep hours','sleep',d?.sleep,'0','12','.1')}${numField('Resting HR (optional)','rhr',d?.rhr,'25','220','1')}
 ${selectField('Energy','energy',d?.energy,[1,2,3,4,5])}${selectField('Soreness','soreness',d?.soreness,[1,2,3,4,5])}
 ${selectField('Stress','stress',d?.stress,[1,2,3,4,5])}${numField('Foot / Achilles pain 0–10','pain',d?.pain,'0','10','1')}
 ${selectField('Motivation','motivation',d?.motivation,[1,2,3,4,5])}${numField('Body mass kg (neutral, optional)','weight',d?.weight,'30','150','.1')}
 </div><h3>Fuel behaviours</h3><div class="g2 grid">
 ${checkField('Substantial breakfast','fuelBreakfast',d?.fuelBreakfast)}${checkField('Pre-session fuel when required','fuelPre',d?.fuelPre)}${checkField('Post-session carbohydrate + protein','fuelPost',d?.fuelPost)}${checkField('Full-day intake felt adequate','fuelDay',d?.fuelDay)}
 </div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Energy, niggles, school/stress, appetite…">${d?.notes||''}</textarea></div><label style="display:flex;gap:8px;align-items:center;margin:8px 0 14px"><input type="checkbox" name="logged" ${d?.logged?'checked':''}> Daily log complete / tomorrow prepared</label><button class="btn">Save check-in</button></form>
 <div class="card"><h2>Today's plan</h2><div class="pill">${plan.name} · ${plan.focus}</div>${plan.tasks.map((q,i)=>`<div class="quest"><input type="checkbox" data-dquest="${i}" ${d?.quests?.[i]?'checked':''}><div>${q}</div><div class="xp"></div></div>`).join('')}<div class="notice">Sleep target: <strong>${profile.sleepTarget} h</strong>. The score rewards execution and recovery; extra mileage does not increase it.</div></div></div>`;
 document.querySelector('#checkForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let rec=await get('daily',today())||{id:today(),quests:d?.quests||[]};['sleep','rhr','energy','soreness','stress','pain','motivation','weight'].forEach(k=>rec[k]=fd.get(k)===''?null:+fd.get(k));['fuelBreakfast','fuelPre','fuelPost','fuelDay','logged'].forEach(k=>rec[k]=fd.get(k)==='on');rec.notes=fd.get('notes');await put('daily',rec);renderDaily();};
 document.querySelectorAll('[data-dquest]').forEach(cb=>cb.onchange=async()=>{let rec=await get('daily',today())||{id:today(),quests:[]};rec.quests=rec.quests||[];rec.quests[+cb.dataset.dquest]=cb.checked;await put('daily',rec);renderDaily();});
}
function numField(label,name,val,min,max,step){return `<div class="field"><label>${label}</label><input name="${name}" type="number" value="${val??''}" min="${min}" max="${max}" step="${step}"></div>`}
function selectField(label,name,val,opts){return `<div class="field"><label>${label}</label><select name="${name}"><option value="">—</option>${opts.map(x=>`<option ${+val===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function checkField(label,name,val){return `<label style="display:flex;gap:8px;align-items:center;padding:8px 0"><input type="checkbox" name="${name}" ${val?'checked':''}>${label}</label>`}

async function renderTraining(){const ws=(await all('workouts')).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#training').innerHTML=`<div class="twoCol"><form class="card" id="workForm"><h2>Log training</h2><div class="row"><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Type</label><select name="type"><option>Run</option><option>Cross-train</option><option>Strength</option><option>Race</option><option>Rest</option></select></div></div><div class="row">${numField('Distance km','distance','','0','60','.1')}${numField('Duration min','duration','','0','300','1')}</div><div class="row">${numField('RPE 1–10','rpe','','1','10','1')}${numField('Pain after 0–10','painAfter','','0','10','1')}</div><div class="field"><label>Purpose</label><select name="purpose"><option>Easy</option><option>Long run</option><option>Threshold</option><option>Aerobic power</option><option>1500 pace</option><option>Speed</option><option>Hills</option><option>Race</option><option>Strength</option><option>Recovery</option></select></div><div class="field"><label>Session details / splits</label><textarea name="notes" placeholder="e.g. 6×800, recoveries, conditions, how you felt"></textarea></div><button class="btn">Save workout</button></form><div class="card"><h2>Recent training</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Purpose</th><th>km</th><th>RPE</th><th></th></tr></thead><tbody>${ws.slice(0,30).map(w=>`<tr><td>${fmtDate(w.date)}</td><td>${w.type}</td><td>${w.purpose||''}</td><td>${w.distance??''}</td><td>${w.rpe??''}</td><td><button class="btn secondary" data-delwork="${w.id}" style="padding:5px 8px">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No workouts logged yet.</td></tr>'}</tbody></table></div></div></div>`;
 document.querySelector('#workForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('workouts',{id:crypto.randomUUID(),date:f.get('date'),type:f.get('type'),purpose:f.get('purpose'),distance:f.get('distance')?+f.get('distance'):null,duration:f.get('duration')?+f.get('duration'):null,rpe:f.get('rpe')?+f.get('rpe'):null,painAfter:f.get('painAfter')?+f.get('painAfter'):null,notes:f.get('notes')});renderTraining();};
 document.querySelectorAll('[data-delwork]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this workout?')){await del('workouts',b.dataset.delwork);renderTraining();}});
}

async function renderCharacter(){const [d,w,b]=await Promise.all([all('daily'),all('workouts'),all('benchmarks')]);const c=computeCharacter(d,w,b);document.querySelector('#character').innerHTML=`<div class="card"><h2>Performance profile</h2><p class="muted">Development scores combine recent execution, health and measured benchmarks. They are trend indicators, not laboratory measurements.</p><div class="g2 grid">${Object.entries(c).map(([k,v])=>`<div class="metric-card"><div class="metric-title"><strong>${iconFor(k)} ${k}</strong><span class="big" style="font-size:24px">${v.toFixed(1)}</span></div><div class="bar"><i style="width:${v}%"></i></div><div class="muted small" style="margin-top:6px">${descFor(k)}</div></div>`).join('')}</div></div><div class="card" style="margin-top:14px"><h2>Operating rules</h2><div class="notice green"><strong>Rest can score 100.</strong> Extra training does not earn extra credit.</div><div class="notice"><strong>Measured stats only move after a real test.</strong> VO₂max, max speed, jump and performance benchmarks stay unchanged until a new test is logged.</div><div class="notice yellow"><strong>Pain overrides streaks.</strong> An appropriate modification is recorded as a good decision, not a failure.</div></div>`;}
function iconFor(k){return {'Engine':'🫀','Speed':'⚡','1500 Power':'🔥','Durability':'🦵','Strength/Power':'🏋️','Recovery':'🔋','Fuel':'🍚'}[k]||'⭐'}
function descFor(k){return {'Engine':'Aerobic consistency + measured aerobic benchmarks.','Speed':'Measured max speed / sprint + power support.','1500 Power':'Race and 800/1500-specific evidence.','Durability':'Low pain + training availability + adherence.','Strength/Power':'Power benchmark + consistent supporting work.','Recovery':'Sleep, adherence and symptom burden.','Fuel':'Daily fuelling behaviour consistency.'}[k]||''}

const METRICS=[['1500m','seconds','lower'],['800m','seconds','lower'],['Max speed','km/h','higher'],['Flying 30m','seconds','lower'],['VO2max','ml/kg/min','higher'],['Threshold pace','sec/km','lower'],['Broad jump','cm','higher'],['Calf capacity','reps or kg','higher'],['Aerobic efficiency','custom score','higher']];
async function renderBenchmarks(){const bs=(await all('benchmarks')).sort((a,b)=>b.date.localeCompare(a.date));document.querySelector('#benchmarks').innerHTML=`<div class="twoCol"><form class="card" id="benchForm"><h2>Log a real benchmark</h2><div class="field"><label>Metric</label><select name="type" id="metricSelect">${METRICS.map(m=>`<option>${m[0]}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Value</label><input type="number" name="value" step=".01" required></div></div><div class="field"><label>Confidence</label><select name="confidence"><option>High — race/lab/electronic timing</option><option>Medium — standardised field test</option><option>Low — watch estimate / rough test</option></select></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Conditions, protocol, shoes, fatigue…"></textarea></div><button class="btn">Save benchmark</button><div class="notice">For race times, enter total seconds. Example: 3:57.48 = 237.48 seconds.</div></form><div class="card"><h2>Latest benchmarks</h2><div id="metricList"></div></div></div><div class="card" style="margin-top:14px"><h2>Benchmark history</h2><div class="scroll"><table><thead><tr><th>Date</th><th>Metric</th><th>Value</th><th>Confidence</th><th></th></tr></thead><tbody>${bs.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${x.type}</td><td>${displayMetric(x)}</td><td>${x.confidence.split('—')[0]}</td><td><button class="btn secondary" data-delbench="${x.id}" style="padding:5px 8px">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No benchmark tests yet.</td></tr>'}</tbody></table></div></div>`;
 document.querySelector('#benchForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await put('benchmarks',{id:crypto.randomUUID(),date:f.get('date'),type:f.get('type'),value:+f.get('value'),confidence:f.get('confidence'),notes:f.get('notes')});renderBenchmarks();};
 document.querySelectorAll('[data-delbench]').forEach(b=>b.onclick=async()=>{if(confirm('Delete benchmark?')){await del('benchmarks',b.dataset.delbench);renderBenchmarks();}});renderMetricCards(bs);
}
function displayMetric(x){if(['1500m','800m'].includes(x.type)){const m=Math.floor(x.value/60),s=(x.value-m*60).toFixed(2).padStart(5,'0');return `${m}:${s}`;}const unit=METRICS.find(m=>m[0]===x.type)?.[1]||'';return `${x.value} ${unit}`;}
function renderMetricCards(bs){const el=document.querySelector('#metricList');el.innerHTML=METRICS.map(m=>{const arr=bs.filter(x=>x.type===m[0]);const latest=arr[0],prev=arr[1];let trend='';if(latest&&prev){const good=m[2]==='higher'?latest.value>prev.value:latest.value<prev.value;trend=`<span class="trend ${latest.value===prev.value?'neutral':good?'up':'danger'}">${latest.value===prev.value?'→':good?'↑':'↓'}</span>`;}return `<div class="metric-card" style="margin-bottom:8px"><div class="metric-title"><strong>${m[0]}</strong>${trend}</div><div style="font-size:21px;font-weight:800;margin-top:4px">${latest?displayMetric(latest):'—'}</div><div class="muted small">${latest?`${fmtDate(latest.date)} · ${latest.confidence}`:'No test logged'}</div></div>`}).join('');}

async function renderSeason(){const [phases,profile,schedule]=await Promise.all([setting('phases',DEFAULT_PHASES),setting('profile',DEFAULT_PROFILE),setting('schedule',DEFAULT_SCHEDULE)]);const cp=currentPhase(phases);document.querySelector('#season').innerHTML=`<div class="twoCol"><div class="card"><h2>12-month plan</h2>${phases.map(p=>`<div class="phase ${cp?.name===p.name?'current':''}"><strong>${p.name}</strong><div class="small muted">${fmtDate(p.start)} → ${fmtDate(p.end)}</div><div style="margin-top:4px">${p.priority}</div></div>`).join('')}</div><form class="card" id="profileForm"><h2>Goals and limits</h2><div class="field"><label>Season goal</label><input name="goalText" value="${profile.goalText||''}"></div><div class="field"><label>Goal 1500 time (text)</label><input name="goal1500" value="${profile.goal1500||''}" placeholder="e.g. 3:50.xx"></div><div class="field"><label>Coach-agreed weekly km target (optional)</label><input name="weeklyKm" value="${profile.weeklyKm||''}" placeholder="Not a quota; leave blank if variable"></div><div class="field"><label>Sleep target hours</label><input type="number" step=".25" min="7" max="11" name="sleepTarget" value="${profile.sleepTarget||8.75}"></div><button class="btn">Save goals</button><div class="notice yellow"><strong>Mileage is not part of the daily score.</strong> The app should never pressure you to hit kilometres your coach or body does not support.</div></form></div><div class="card" style="margin-top:14px"><h2>Default weekly structure</h2><div class="scroll"><table><thead><tr><th>Day</th><th>Mission</th><th>Focus</th></tr></thead><tbody>${[1,2,3,4,5,6,0].map(i=>`<tr><td>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</td><td>${schedule[i].name}</td><td>${schedule[i].focus}</td></tr>`).join('')}</tbody></table></div></div>`;
 document.querySelector('#profileForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await setSetting('profile',{goalText:f.get('goalText'),goal1500:f.get('goal1500'),weeklyKm:f.get('weeklyKm'),sleepTarget:+f.get('sleepTarget')});renderSeason();};}

async function storageInfo(){
 const out={persisted:null,usage:null,quota:null};
 try{if(navigator.storage?.persisted)out.persisted=await navigator.storage.persisted();if(navigator.storage?.estimate){const e=await navigator.storage.estimate();out.usage=e.usage||0;out.quota=e.quota||0;}}catch{}return out;
}
function bytes(n){if(n==null)return '—';if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(1)} KB`;return `${(n/1048576).toFixed(1)} MB`;}
async function requestPersistentStorage(){if(!navigator.storage?.persist)return alert('Persistent-storage requests are not supported by this browser. Regular backups remain the safest protection.');try{const ok=await navigator.storage.persist();alert(ok?'Persistent storage is enabled for this site on this browser.':'The browser did not grant persistent storage. Your data still saves locally; keep regular backups.');renderData();renderSystemBar();}catch{alert('Could not request persistent storage on this browser.');}}
async function renderData(){const daily=await all('daily'),workouts=await all('workouts'),bench=await all('benchmarks'),meta=await setting('meta',{}),store=await storageInfo();const last=meta.lastBackupAt?new Date(meta.lastBackupAt):null;const days=last?Math.floor((Date.now()-last.getTime())/86400000):null;document.querySelector('#data').innerHTML=`<div class="g2 grid"><div class="card"><h2>Backups</h2><p class="muted">Training records are stored on this device. App updates do not erase the database, but clearing website/app data can. Keep a backup outside the app.</p><div class="row"><button class="btn" id="exportJson">Download backup</button><button class="btn secondary" id="exportCsv">Export CSV</button></div><div class="notice ${days===null||days>14?'yellow':'green'}">${last?`Last backup: <strong>${last.toLocaleString()}</strong> (${days} day${days===1?'':'s'} ago).`:'No backup has been recorded yet.'}</div><div class="field" style="margin-top:14px"><label>Restore a backup</label><input type="file" id="restoreFile" accept="application/json,.json"></div><label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="replaceRestore" checked> Replace the current database with this backup</label><button class="btn secondary" id="restoreBtn">Restore backup</button></div><div class="card"><h2>App and storage</h2><table><tr><td>Version</td><td>${APP_VERSION}</td></tr><tr><td>Daily logs</td><td>${daily.length}</td></tr><tr><td>Workouts</td><td>${workouts.length}</td></tr><tr><td>Tests</td><td>${bench.length}</td></tr><tr><td>Persistent storage</td><td>${store.persisted===true?'Enabled':store.persisted===false?'Not granted':'Unknown'}</td></tr><tr><td>Storage used</td><td>${bytes(store.usage)}</td></tr></table><div class="row" style="margin-top:12px"><button class="btn secondary" id="persistBtn">Protect local storage</button><button class="btn secondary" id="installBtnSettings">Install app</button></div><div class="notice">Updates replace the app files and cache only. The IndexedDB database is separate and remains in place.</div></div></div><div class="card" style="margin-top:14px"><h2>Reset</h2><p class="muted">Only use this after downloading a backup if you might want the records later.</p><button class="btn dangerbtn" id="wipeBtn">Delete all local data</button></div>`;
 document.querySelector('#exportJson').onclick=exportBackup;document.querySelector('#exportCsv').onclick=exportCSVs;document.querySelector('#restoreBtn').onclick=restoreBackup;document.querySelector('#wipeBtn').onclick=wipeAll;document.querySelector('#persistBtn').onclick=requestPersistentStorage;document.querySelector('#installBtnSettings').onclick=installApp;
}
async function exportBackup(){const payload={app:'Trackline',format:2,version:APP_VERSION,exportedAt:new Date().toISOString(),daily:await all('daily'),workouts:await all('workouts'),benchmarks:await all('benchmarks'),settings:await all('settings')};download(`trackline-backup-${today()}.json`,JSON.stringify(payload,null,2),'application/json');const meta=await setting('meta',{});meta.lastBackupAt=new Date().toISOString();await setSetting('meta',meta);renderSystemBar();}
function csv(rows){if(!rows.length)return '';const keys=[...new Set(rows.flatMap(Object.keys))];const esc=v=>`"${String(v??'').replaceAll('"','""')}"`;return [keys.join(','),...rows.map(r=>keys.map(k=>esc(Array.isArray(r[k])?JSON.stringify(r[k]):r[k])).join(','))].join('\n');}
async function exportCSVs(){const parts=[['daily',await all('daily')],['workouts',await all('workouts')],['tests',await all('benchmarks')]];parts.forEach(([name,rows])=>download(`trackline-${name}-${today()}.csv`,csv(rows),'text/csv'));}
function download(name,text,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function clearStores(){for(const s of ['daily','workouts','benchmarks','settings'])await new Promise((res,rej)=>{const tx=db.transaction(s,'readwrite');tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.objectStore(s).clear();});}
async function restoreBackup(){const f=document.querySelector('#restoreFile').files[0];if(!f)return alert('Choose a JSON backup first.');let p;try{p=JSON.parse(await f.text())}catch{return alert('That file is not valid JSON.')}if(!p||!Array.isArray(p.daily)||!Array.isArray(p.workouts)||!Array.isArray(p.benchmarks)||!Array.isArray(p.settings))return alert('This does not look like a valid Trackline / Runner RPG backup.');const replace=document.querySelector('#replaceRestore').checked;if(!confirm(replace?'Replace the current local database with this backup?':'Merge this backup into the current local database?'))return;if(replace)await clearStores();for(const [s,rows] of [['daily',p.daily],['workouts',p.workouts],['benchmarks',p.benchmarks],['settings',p.settings]])for(const r of rows)await put(s,r);await initDefaults();alert('Backup restored.');renderData();}
async function wipeAll(){if(!confirm('Delete ALL local Trackline data? Download a backup first if you need it.'))return;await clearStores();await initDefaults();alert('Local data deleted.');renderData();renderSystemBar();}

let deferredInstallPrompt=null;
let waitingWorker=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
async function renderSystemBar(){const el=document.querySelector('#systemBar');if(!el)return;const meta=await setting('meta',{});const last=meta.lastBackupAt?new Date(meta.lastBackupAt):null;const backupText=last?`Backup ${Math.floor((Date.now()-last.getTime())/86400000)}d ago`:'Backup needed';const store=await storageInfo();el.innerHTML=`<span class="pill">v${APP_VERSION}</span><span class="pill">${navigator.onLine?'Online':'Offline'}</span><span class="pill">${store.persisted?'Storage protected':'Local storage'}</span><span class="pill ${last?'':'warn'}">${backupText}</span>${isStandalone()?'':'<button class="pill" id="quickInstall" style="cursor:pointer">Install</button>'}`;const b=document.querySelector('#quickInstall');if(b)b.onclick=installApp;}
async function installApp(){if(isStandalone())return alert('Trackline is already running as an installed app.');if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;renderSystemBar();return;}if(isIOS())return alert('On iPhone/iPad: open Trackline in Safari, tap Share, choose “Add to Home Screen”, turn on “Open as Web App”, then tap Add.');alert('Use your browser menu and choose “Install app” or “Add to Home Screen”. If that option is missing, make sure you opened the HTTPS website rather than the downloaded HTML file.');}
function showUpdate(reg){waitingWorker=reg.waiting;document.querySelector('#updateBanner')?.classList.add('show');}
async function setupServiceWorker(){if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return;try{const reg=await navigator.serviceWorker.register('./sw.js');if(reg.waiting)showUpdate(reg);reg.addEventListener('updatefound',()=>{const worker=reg.installing;if(!worker)return;worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate(reg);});});navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());setInterval(()=>reg.update().catch(()=>{}),60*60*1000);}catch(e){console.warn('Service worker registration failed',e);}}
async function requestPersistenceQuietly(){try{if(navigator.storage?.persisted&&navigator.storage?.persist){const already=await navigator.storage.persisted();if(!already)await navigator.storage.persist();}}catch{}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;renderSystemBar();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;renderSystemBar();});
window.addEventListener('online',renderSystemBar);window.addEventListener('offline',renderSystemBar);
document.querySelector('#applyUpdate').onclick=()=>{if(waitingWorker)waitingWorker.postMessage({type:'SKIP_WAITING'});else location.reload();};
async function start(){await dbOpen();await initDefaults();navInit();await renderDashboard();await renderSystemBar();requestPersistenceQuietly();setupServiceWorker();}
start();
</script>
